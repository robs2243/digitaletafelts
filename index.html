<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-app.png" />
    <title>Digitale Tafel</title>
  </head>
  <body>
    <!-- ═══ HEADER ═══ -->
    <header>
      <h1>📋 Digitale Tafel</h1>
      <button class="hdr-btn" id="btn-planning" title="Planung: entplanen (alle oder nach Kürzel)">📅 Planung</button>
      <button class="hdr-btn" id="btn-comments" title="Alle Kommentare anzeigen">💬 Kommentare</button>
      <div class="hdr-filter">
        <span class="hdr-filter-lbl">Anzeigen:</span>
        <label><input type="checkbox" id="filter-hj1" checked /> 1. HJ</label>
        <label><input type="checkbox" id="filter-hj2" checked /> 2. HJ</label>
      </div>
      <div class="hdr-filter">
        <span class="hdr-filter-lbl">Hervorheben:</span>
        <label><input type="checkbox" id="filter-labor" /> ⚗ Labor</label>
        <label><input type="checkbox" id="filter-werkstatt" /> 🔧 Werkstatt</label>
        <label><input type="checkbox" id="rooms-only" /> 📍 Nur Räume</label>
      </div>
      <div class="hdr-zoom">
        <button class="hdr-btn hdr-zoom-btn" id="zoom-out" title="Verkleinern (Strg + Mausrad / Strg & −)">−</button>
        <button class="hdr-btn hdr-zoom-btn" id="zoom-reset" title="Zoom zurücksetzen (Strg & 0)">100%</button>
        <button class="hdr-btn hdr-zoom-btn" id="zoom-in" title="Vergrößern (Strg + Mausrad / Strg & +)">+</button>
      </div>
      <div class="hsp"></div>
      <button class="hdr-btn" id="btn-open" title="Plan aus Datei laden">📂 Öffnen…</button>
      <button class="hdr-btn" id="btn-save" title="In Datei speichern">💾 Speichern</button>
      <button class="hdr-btn" id="btn-save-as" title="Als neue Datei speichern">Speichern unter…</button>
      <div class="sbadge" id="sbadge">✓ Gespeichert</div>
    </header>

    <!-- ═══ APP ═══ -->
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sb-sec" id="pool-head" title="Doppelklick: alle nicht verplanten Karten mit Filter">
          <h2>Lehrer-Pool</h2>
          <div class="sb-actions">
            <button class="btn-icon" id="btn-clear-cards" title="Karten löschen">🗑</button>
            <button class="btn-plus" id="btn-new-card" title="Neue Karte erstellen">+</button>
          </div>
        </div>
        <div class="pool-search">
          <input id="search" type="text" placeholder="🔍 Kürzel suchen…" autocomplete="off" />
          <button id="search-clear" title="Suche zurücksetzen" type="button">✕</button>
        </div>
        <div class="pool-search">
          <input id="search-room" type="text" placeholder="🔍 Raum suchen…" autocomplete="off" />
          <button id="search-room-clear" title="Raum-Suche zurücksetzen" type="button">✕</button>
        </div>
        <div class="pool-search">
          <input id="search-klasse" type="text" placeholder="🔍 Klasse suchen…" autocomplete="off" />
          <button id="search-klasse-clear" title="Klassen-Suche zurücksetzen" type="button">✕</button>
        </div>
        <button id="btn-pool-list" class="pool-list-btn" type="button" title="Nicht verplante Karten mit Filter">
          📋 Nicht verplante Karten
        </button>
        <div class="pool" id="pool"></div>

        <div class="sb-sec" style="margin-top: auto">
          <h2>Stunden-Übersicht</h2>
        </div>
        <div class="stats" id="stats"></div>
      </aside>

      <!-- TIMETABLE -->
      <main class="main">
        <div class="tt-wrap">
          <table class="tt" id="tt"></table>
        </div>
      </main>
    </div>

    <!-- ═══ KARTEN-MODAL (anlegen/bearbeiten) ═══ -->
    <div class="overlay" id="add-modal">
      <div class="modal">
        <h2 id="am-title" style="color: #1a237e">Karte erstellen</h2>
        <div class="fg">
          <label>Klasse (optional – bindet die Karte an die passende Spalte)</label>
          <input id="am-klasse" type="text" placeholder="z.B. E3EG" />
        </div>
        <div class="fg">
          <label>Kürzel (max. 5 Zeichen)</label>
          <input id="am-abbr" type="text" maxlength="5" placeholder="z.B. KN" />
        </div>
        <div class="fg">
          <label>Fach (optional)</label>
          <input id="am-fach" type="text" placeholder="z.B. Mathematik" />
        </div>
        <div class="fg">
          <label>Raum (optional)</label>
          <input id="am-room" type="text" placeholder="z.B. R204" />
        </div>
        <div class="fg">
          <label>Dauer (Stunden am Stück)</label>
          <select id="am-dur"></select>
        </div>
        <div class="fg">
          <label>Farbe</label>
          <div class="swatches" id="am-swatches"></div>
        </div>
        <div class="fg">
          <label>Halbjahr (optional – leer = ganzes Jahr)</label>
          <div class="half-row">
            <label class="half-opt"><input type="checkbox" id="am-half1" /> 1. Halbjahr</label>
            <label class="half-opt"><input type="checkbox" id="am-half2" /> 2. Halbjahr</label>
          </div>
        </div>
        <div class="fg">
          <label for="am-labor" style="cursor: pointer">
            <div class="labor-row">
              <input type="checkbox" id="am-labor" />
              <div>
                <div class="labor-row-lbl">⚗ Labor / Gruppenunterricht</div>
                <div class="labor-row-sub">Diese Karte darf auf andere Karten gestapelt werden</div>
              </div>
            </div>
          </label>
        </div>
        <div class="fg">
          <label>Gruppe a/b (beim Planen wird Labor a auf b gelegt)</label>
          <select id="am-labgroup">
            <option value="">— keine</option>
            <option value="a">Gruppe a</option>
            <option value="b">Gruppe b</option>
          </select>
        </div>
        <div class="fg">
          <label for="am-werkstatt" style="cursor: pointer">
            <div class="labor-row">
              <input type="checkbox" id="am-werkstatt" />
              <div>
                <div class="labor-row-lbl">🔧 Werkstatt</div>
                <div class="labor-row-sub">Diese Karte darf auf andere Karten gestapelt werden</div>
              </div>
            </div>
          </label>
        </div>
        <div class="fg" style="margin-bottom: 0">
          <label for="am-vierwoechig" style="cursor: pointer">
            <div class="labor-row">
              <input type="checkbox" id="am-vierwoechig" />
              <div>
                <div class="labor-row-lbl">¼ 4-wöchig</div>
                <div class="labor-row-sub">Zählt bei den Stunden mit halbem Gewicht (Deputat 0,25)</div>
              </div>
            </div>
          </label>
        </div>
        <div class="mbtns">
          <button class="btn btn-sec" id="am-cancel">Abbrechen</button>
          <button class="btn btn-del" id="am-delbtn" style="display: none">Löschen</button>
          <button class="btn btn-ok" id="am-save">Speichern</button>
        </div>
      </div>
    </div>

    <!-- ═══ KARTEN-LÖSCHEN-MODAL ═══ -->
    <div class="overlay" id="clear-modal">
      <div class="modal">
        <h2 style="color: #c62828">🗑 Karten löschen</h2>
        <div class="fg" style="margin-bottom: 0">
          <label>Welche Karten sollen gelöscht werden?</label>
          <select id="clear-select"></select>
        </div>
        <div class="mbtns">
          <button class="btn btn-sec" id="clear-cancel">Abbrechen</button>
          <button class="btn btn-del" id="clear-confirm">Löschen…</button>
        </div>
      </div>
    </div>

    <!-- ═══ LEHRER-STUNDEN-MODAL (Klick auf Kürzel in der Übersicht) ═══ -->
    <div class="overlay" id="teacher-modal">
      <div class="modal teacher-modal-box">
        <h2 id="tm-title" style="color: #1a237e">Stunden</h2>
        <div id="tm-sub" class="tm-sub"></div>
        <div id="tm-list" class="tm-list"></div>
        <div class="mbtns">
          <button class="btn btn-ok" id="tm-close">Schließen</button>
        </div>
      </div>
    </div>

    <!-- ═══ POOL-LISTE-MODAL (Doppelklick auf Lehrer-Pool) ═══ -->
    <div class="overlay" id="pool-list-modal">
      <div class="modal teacher-modal-box" style="width: 760px">
        <h2 style="color: #1a237e">Nicht verplante Karten</h2>
        <div class="pl-filters">
          <input id="pl-abbr" type="text" placeholder="Kürzel" autocomplete="off" />
          <input id="pl-klasse" type="text" placeholder="Klasse" autocomplete="off" />
          <input id="pl-room" type="text" placeholder="Raum" autocomplete="off" />
          <div class="pl-checks">
            <label><input type="checkbox" id="pl-labor" /> ⚗ Labor</label>
            <label><input type="checkbox" id="pl-werkstatt" /> 🔧 Werkstatt</label>
          </div>
        </div>
        <div id="pl-sub" class="tm-sub"></div>
        <div id="pl-list" class="tm-list"></div>
        <input type="file" id="pl-import-file" accept=".xlsx,.xls,.csv" hidden />
        <div class="mbtns">
          <button class="btn btn-sec" id="pl-template" title="Excel-Vorlage herunterladen">📄 Vorlage</button>
          <button class="btn btn-ok" id="pl-import">📥 Excel importieren</button>
          <button class="btn btn-del" id="pl-del-abbr" title="Karten zum gesuchten Kürzel löschen" style="margin-left: auto">🗑 Kürzel löschen</button>
          <button class="btn btn-del" id="pl-del-all" title="Alle nicht verplanten Karten löschen">🗑 Alle löschen</button>
          <button class="btn btn-sec" id="pl-close">Schließen</button>
        </div>
      </div>
    </div>

    <!-- ═══ PLANUNGS-MODAL (Button in der Kopfzeile) ═══ -->
    <div class="overlay" id="planning-modal">
      <div class="modal" style="width: 720px; max-width: 92vw">
        <h2 style="color: #1a237e">📅 Planung</h2>
        <div class="fg">
          <label>Automatisch verplanen – freie Karten nach den Regeln einsortieren</label>
          <button class="btn btn-pri" id="plan-auto" style="width: 100%">✨ Automatisch verplanen</button>
          <div style="font-size: 12px; color: #555; margin-top: 6px">
            Verteilt die freien Karten nach den Planungsregeln.
            <a href="#" id="plan-rules" style="color: var(--accent)">📄 Regeln herunterladen</a>
          </div>
        </div>
        <div class="fg" style="margin-bottom: 0; border-top: 1px solid #e0e0e0; padding-top: 12px">
          <label>Entplanen – Kürzel suchen und zurück in den Pool legen</label>
          <input id="plan-abbr" type="text" placeholder="Kürzel" list="plan-abbr-list" autocomplete="off" />
          <datalist id="plan-abbr-list"></datalist>
          <div id="plan-sub" style="font-size: 12px; color: #555; margin-top: 6px"></div>
        </div>
        <div class="mbtns">
          <button class="btn btn-sec" id="plan-cancel">Abbrechen</button>
          <button class="btn btn-del" id="plan-unplace-unlocked" title="Alle Karten außer fixierte zurück in den Pool">Alle außer fixierte</button>
          <button class="btn btn-del" id="plan-unplace-all">Alle entplanen…</button>
          <button class="btn btn-del" id="plan-unplace">Kürzel entplanen</button>
        </div>
      </div>
    </div>

    <!-- ═══ ALLE-KOMMENTARE-MODAL (Button in der Kopfzeile) ═══ -->
    <div class="overlay" id="comments-modal">
      <div class="modal teacher-modal-box">
        <h2 style="color: #1a237e">💬 Kommentare</h2>
        <div id="cmall-list" class="tm-list"></div>
        <div class="mbtns">
          <button class="btn btn-del" id="cmall-clear-all" style="margin-right: auto">Alle löschen</button>
          <button class="btn btn-ok" id="cmall-close">Schließen</button>
        </div>
      </div>
    </div>

    <!-- ═══ KOMMENTAR-MODAL (Doppelklick auf Karte) ═══ -->
    <div class="overlay" id="comment-modal">
      <div class="modal">
        <h2 id="cm-title" style="color: #1a237e">💬 Kommentar</h2>
        <div class="fg" style="margin-bottom: 0">
          <label>Kommentar (leer = kein Kommentar)</label>
          <textarea id="cm-text" rows="4" placeholder="z.B. Raumwechsel, Material mitbringen …"></textarea>
        </div>
        <div class="mbtns">
          <button class="btn btn-sec" id="cm-cancel">Abbrechen</button>
          <button class="btn btn-del" id="cm-clear" style="display: none">Entfernen</button>
          <button class="btn btn-ok" id="cm-save">Speichern</button>
        </div>
      </div>
    </div>

    <!-- ═══ KOLLISIONS-MODAL ═══ -->
    <div class="overlay" id="warn-modal">
      <div class="modal warn-modal">
        <div class="warn-icon">⚠️</div>
        <h2 id="warn-title">Kollision erkannt!</h2>
        <div class="warn-msg" id="warn-msg">–</div>
        <div id="warn-hint-box"></div>
        <div class="mbtns" id="warn-btns" style="justify-content: center; margin-top: 16px"></div>
      </div>
    </div>

    <!-- ═══ TOAST ═══ -->
    <div class="toast" id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
