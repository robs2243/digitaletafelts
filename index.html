<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitale Tafel</title>
  </head>
  <body>
    <!-- ═══ HEADER ═══ -->
    <header>
      <h1>📋 Digitale Tafel</h1>
      <button class="hdr-btn" id="btn-add-class"><span>+</span> Klasse</button>
      <div class="hdr-filter">
        <span class="hdr-filter-lbl">Anzeigen:</span>
        <label><input type="checkbox" id="filter-hj1" checked /> 1. HJ</label>
        <label><input type="checkbox" id="filter-hj2" checked /> 2. HJ</label>
      </div>
      <div class="hsp"></div>
      <div class="sbadge" id="sbadge">✓ Gespeichert</div>
    </header>

    <!-- ═══ APP ═══ -->
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sb-sec">
          <h2>Lehrer-Pool</h2>
          <div class="sb-actions">
            <button class="btn-icon" id="btn-clear-cards" title="Karten löschen">🗑</button>
            <button class="btn-plus" id="btn-new-card" title="Neue Karte erstellen">+</button>
          </div>
        </div>
        <div class="pool-search">
          <input id="search" type="text" placeholder="🔍 Kürzel suchen…" autocomplete="off" />
          <button id="search-clear" title="Suche zurücksetzen" type="button">✕</button>
        </div>
        <div class="pool" id="pool"></div>

        <div class="sb-sec" style="margin-top: auto">
          <h2>Stunden-Übersicht</h2>
        </div>
        <div class="stats" id="stats"></div>
      </aside>

      <!-- TIMETABLE -->
      <main class="main">
        <div class="tt-wrap">
          <table class="tt" id="tt"></table>
        </div>
      </main>
    </div>

    <!-- ═══ KARTEN-MODAL (anlegen/bearbeiten) ═══ -->
    <div class="overlay" id="add-modal">
      <div class="modal">
        <h2 id="am-title" style="color: #1a237e">Karte erstellen</h2>
        <div class="fg">
          <label>Kürzel (max. 5 Zeichen)</label>
          <input id="am-abbr" type="text" maxlength="5" placeholder="z.B. KN" />
        </div>
        <div class="fg">
          <label>Fach (optional)</label>
          <input id="am-fach" type="text" placeholder="z.B. Mathematik" />
        </div>
        <div class="fg">
          <label>Raum (optional)</label>
          <input id="am-room" type="text" placeholder="z.B. R204" />
        </div>
        <div class="fg">
          <label>Dauer (Stunden am Stück)</label>
          <select id="am-dur"></select>
        </div>
        <div class="fg">
          <label>Farbe</label>
          <div class="swatches" id="am-swatches"></div>
        </div>
        <div class="fg">
          <label>Halbjahr (optional – leer = ganzes Jahr)</label>
          <div class="half-row">
            <label class="half-opt"><input type="checkbox" id="am-half1" /> 1. Halbjahr</label>
            <label class="half-opt"><input type="checkbox" id="am-half2" /> 2. Halbjahr</label>
          </div>
        </div>
        <div class="fg" style="margin-bottom: 0">
          <label for="am-labor" style="cursor: pointer">
            <div class="labor-row">
              <input type="checkbox" id="am-labor" />
              <div>
                <div class="labor-row-lbl">⚗ Labor / Gruppenunterricht</div>
                <div class="labor-row-sub">Diese Karte darf auf andere Karten gestapelt werden</div>
              </div>
            </div>
          </label>
        </div>
        <div class="mbtns">
          <button class="btn btn-sec" id="am-cancel">Abbrechen</button>
          <button class="btn btn-del" id="am-delbtn" style="display: none">Löschen</button>
          <button class="btn btn-ok" id="am-save">Speichern</button>
        </div>
      </div>
    </div>

    <!-- ═══ KARTEN-LÖSCHEN-MODAL ═══ -->
    <div class="overlay" id="clear-modal">
      <div class="modal">
        <h2 style="color: #c62828">🗑 Karten löschen</h2>
        <div class="fg" style="margin-bottom: 0">
          <label>Welche Karten sollen gelöscht werden?</label>
          <select id="clear-select"></select>
        </div>
        <div class="mbtns">
          <button class="btn btn-sec" id="clear-cancel">Abbrechen</button>
          <button class="btn btn-del" id="clear-confirm">Löschen…</button>
        </div>
      </div>
    </div>

    <!-- ═══ KOMMENTAR-MODAL (Doppelklick auf Karte) ═══ -->
    <div class="overlay" id="comment-modal">
      <div class="modal">
        <h2 id="cm-title" style="color: #1a237e">💬 Kommentar</h2>
        <div class="fg" style="margin-bottom: 0">
          <label>Kommentar (leer = kein Kommentar)</label>
          <textarea id="cm-text" rows="4" placeholder="z.B. Raumwechsel, Material mitbringen …"></textarea>
        </div>
        <div class="mbtns">
          <button class="btn btn-sec" id="cm-cancel">Abbrechen</button>
          <button class="btn btn-del" id="cm-clear" style="display: none">Entfernen</button>
          <button class="btn btn-ok" id="cm-save">Speichern</button>
        </div>
      </div>
    </div>

    <!-- ═══ KOLLISIONS-MODAL ═══ -->
    <div class="overlay" id="warn-modal">
      <div class="modal warn-modal">
        <div class="warn-icon">⚠️</div>
        <h2 id="warn-title">Kollision erkannt!</h2>
        <div class="warn-msg" id="warn-msg">–</div>
        <div id="warn-hint-box"></div>
        <div class="mbtns" id="warn-btns" style="justify-content: center; margin-top: 16px"></div>
      </div>
    </div>

    <!-- ═══ TOAST ═══ -->
    <div class="toast" id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
